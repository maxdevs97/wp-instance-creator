<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordPress Instance Creator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    
    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .helper-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    
    .domain-preview {
      background: #f5f5f5;
      padding: 10px 16px;
      border-radius: 6px;
      margin-top: 5px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #667eea;
      font-weight: 600;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }
    
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 25px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    
    .status.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      display: block;
    }
    
    .status.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      display: block;
    }
    
    .status.processing {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
      display: block;
    }
    
    .status.queued {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      display: block;
    }
    
    .progress-container {
      margin-top: 15px;
    }
    
    .progress-step {
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8f9fa;
      color: #333;
    }
    
    .progress-step.active {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
      font-weight: 600;
    }
    
    .progress-step.completed {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    
    .progress-step.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    
    .step-icon {
      font-size: 16px;
      min-width: 20px;
    }
    
    .log-container {
      margin-top: 15px;
      max-height: 300px;
      overflow-y: auto;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    
    .log-entry {
      padding: 2px 0;
      color: #333;
    }
    
    .result-details {
      margin-top: 15px;
      background: white;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #c3e6cb;
    }
    
    .result-details h3 {
      color: #155724;
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e9ecef;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .result-item:last-child {
      border-bottom: none;
    }
    
    .result-label {
      font-weight: 600;
      color: #333;
    }
    
    .result-value {
      color: #667eea;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      word-break: break-all;
    }
    
    .result-value a {
      color: #667eea;
      text-decoration: none;
    }
    
    .result-value a:hover {
      text-decoration: underline;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    .spinner-small {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(12, 84, 96, 0.3);
      border-radius: 50%;
      border-top-color: #0c5460;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .password-gate {
      margin-bottom: 30px;
      padding-bottom: 30px;
      border-bottom: 2px solid #e0e0e0;
    }
    
    #mainForm {
      display: none;
    }
    
    #mainForm.unlocked {
      display: block;
    }
    
    .job-info {
      background: #f8f9fa;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #666;
    }
    
    .job-info strong {
      color: #333;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 WordPress Instance Creator</h1>
    <p class="subtitle">Clone mbstest1.sherstaging.com with automation</p>
    
    <!-- Password Gate -->
    <div class="password-gate" id="passwordGate">
      <div class="form-group">
        <label for="gatePassword">Team Password</label>
        <input 
          type="password" 
          id="gatePassword" 
          placeholder="Enter team password"
          autocomplete="off"
        />
        <div class="helper-text">Enter the team password to access the form</div>
      </div>
      <button onclick="unlockForm()">Unlock Form</button>
    </div>
    
    <!-- Main Form (hidden until password verified) -->
    <form id="mainForm" onsubmit="createInstance(event)">
      <div class="form-group">
        <label for="subdomain">Subdomain</label>
        <input 
          type="text" 
          id="subdomain" 
          placeholder="e.g., project1, clientname, demo"
          pattern="[a-z0-9-]+"
          required
          oninput="updateDomainPreview()"
        />
        <div class="helper-text">Use only lowercase letters, numbers, and hyphens</div>
        <div class="domain-preview" id="domainPreview">→ .sherstaging.com</div>
      </div>
      
      <div class="form-group">
        <label for="wpPassword">WordPress Admin Password</label>
        <input 
          type="password" 
          id="wpPassword" 
          placeholder="Enter strong password"
          required
          minlength="8"
        />
        <div class="helper-text">Username will be: clients@sheragency.com</div>
      </div>
      
      <button type="submit" id="submitBtn">
        Create WordPress Instance
      </button>
    </form>
    
    <!-- Status Display -->
    <div class="status" id="status"></div>
  </div>
  
  <script>
    let formPassword = '';
    let pollInterval = null;
    let currentJobId = null;
    
    function updateDomainPreview() {
      const subdomain = document.getElementById('subdomain').value;
      const preview = document.getElementById('domainPreview');
      
      if (subdomain) {
        preview.textContent = `→ ${subdomain}.sherstaging.com`;
      } else {
        preview.textContent = '→ .sherstaging.com';
      }
    }
    
    async function unlockForm() {
      const password = document.getElementById('gatePassword').value;
      
      if (!password) {
        alert('Please enter the team password');
        return;
      }
      
      try {
        const response = await fetch('/api/verify-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          formPassword = password;
          document.getElementById('passwordGate').style.display = 'none';
          document.getElementById('mainForm').classList.add('unlocked');
        } else {
          alert('Invalid password. Please try again.');
          document.getElementById('gatePassword').value = '';
        }
      } catch (error) {
        alert('Error verifying password: ' + error.message);
      }
    }
    
    function stopPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }
    
    async function pollJobStatus(jobId) {
      try {
        const response = await fetch(`/api/status/${jobId}`);
        const data = await response.json();
        
        if (!data.success) {
          stopPolling();
          showError('Failed to fetch job status');
          return;
        }
        
        const job = data.job;
        updateStatusDisplay(job);
        
        // Stop polling if job is completed or failed
        if (job.status === 'completed' || job.status === 'failed') {
          stopPolling();
        }
      } catch (error) {
        console.error('Polling error:', error);
      }
    }
    
    function updateStatusDisplay(job) {
      const statusEl = document.getElementById('status');
      
      if (job.status === 'pending') {
        statusEl.className = 'status queued';
        statusEl.innerHTML = `
          <div class="job-info">Job ID: <strong>${job.id}</strong></div>
          <strong>⏳ Queued</strong><br>
          Your job is queued and will start processing shortly...
        `;
      } else if (job.status === 'processing') {
        statusEl.className = 'status processing';
        
        let html = `
          <div class="job-info">Job ID: <strong>${job.id}</strong></div>
          <strong><span class="spinner-small"></span> Processing...</strong><br>
          <div style="margin-top: 8px; font-size: 13px;">
            Current step: <strong>${job.progress.step}</strong><br>
            ${job.progress.message}
          </div>
        `;
        
        if (job.progress.steps && job.progress.steps.length > 0) {
          html += '<div class="progress-container">';
          
          const stepGroups = {
            'snapshot': ['snapshot_start', 'snapshot_initiated', 'snapshot_waiting', 'snapshot_complete', 'snapshot_found'],
            'droplet': ['droplet_start', 'droplet_created', 'droplet_waiting', 'droplet_active'],
            'dns': ['dns_start', 'dns_updated', 'dns_created'],
            'ssh': ['ssh_wait', 'ssh_connect', 'ssh_complete', 'ssh_warnings'],
            'verify': ['verify_start', 'verify_success', 'verify_warning']
          };
          
          const completedSteps = new Set(job.progress.steps.map(s => s.step));
          const currentStep = job.progress.step;
          
          for (const [group, steps] of Object.entries(stepGroups)) {
            const groupCompleted = steps.some(s => completedSteps.has(s));
            const groupActive = steps.includes(currentStep);
            const groupDone = steps.every(s => completedSteps.has(s) || s === currentStep);
            
            let icon = '⏹';
            let className = 'progress-step';
            let label = group.charAt(0).toUpperCase() + group.slice(1);
            
            if (groupActive) {
              icon = '⏳';
              className = 'progress-step active';
            } else if (groupDone && groupCompleted) {
              icon = '✓';
              className = 'progress-step completed';
            } else if (groupCompleted) {
              icon = '🔄';
              className = 'progress-step active';
            }
            
            html += `<div class="${className}"><span class="step-icon">${icon}</span>${label}</div>`;
          }
          
          html += '</div>';
        }
        
        html += `<div style="margin-top: 12px; font-size: 12px; color: #666;">
          ⏱ Processing typically takes 8-12 minutes. This page auto-updates every 10 seconds.
        </div>`;
        
        statusEl.innerHTML = html;
      } else if (job.status === 'completed') {
        statusEl.className = 'status success';
        
        let html = `
          <div class="job-info">Job ID: <strong>${job.id}</strong></div>
          <strong>✅ Success!</strong> WordPress instance created.
        `;
        
        if (job.result) {
          html += '<div class="result-details">';
          html += '<h3>🎉 Your Site is Ready!</h3>';
          html += `<div class="result-item">
            <span class="result-label">Live URL:</span>
            <span class="result-value"><a href="https://${job.result.domain}" target="_blank">${job.result.domain}</a></span>
          </div>`;
          html += `<div class="result-item">
            <span class="result-label">Admin Login:</span>
            <span class="result-value"><a href="${job.result.wpAdminUrl}" target="_blank">${job.result.wpAdminUrl}</a></span>
          </div>`;
          html += `<div class="result-item">
            <span class="result-label">Username:</span>
            <span class="result-value">${job.result.wpAdminUser}</span>
          </div>`;
          html += `<div class="result-item">
            <span class="result-label">Droplet IP:</span>
            <span class="result-value">${job.result.dropletIp}</span>
          </div>`;
          html += `<div class="result-item">
            <span class="result-label">Droplet ID:</span>
            <span class="result-value">${job.result.dropletId}</span>
          </div>`;
          html += '</div>';
        }
        
        if (job.progress.steps && job.progress.steps.length > 0) {
          html += '<div class="log-container">';
          html += '<strong>Execution Log:</strong><br>';
          job.progress.steps.forEach(step => {
            const time = new Date(step.timestamp).toLocaleTimeString();
            html += `<div class="log-entry">[${time}] ${escapeHtml(step.message)}</div>`;
          });
          html += '</div>';
        }
        
        statusEl.innerHTML = html;
        
        // Re-enable form for next instance
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = 'Create Another Instance';
      } else if (job.status === 'failed') {
        statusEl.className = 'status error';
        
        let html = `
          <div class="job-info">Job ID: <strong>${job.id}</strong></div>
          <strong>❌ Error:</strong> ${escapeHtml(job.error || 'Instance creation failed')}
        `;
        
        if (job.progress.steps && job.progress.steps.length > 0) {
          html += '<div class="log-container">';
          html += '<strong>Execution Log:</strong><br>';
          job.progress.steps.forEach(step => {
            const time = new Date(step.timestamp).toLocaleTimeString();
            html += `<div class="log-entry">[${time}] ${escapeHtml(step.message)}</div>`;
          });
          html += '</div>';
        }
        
        html += '<div style="margin-top: 12px; padding: 10px; background: white; border-radius: 6px; font-size: 13px;">';
        html += '<strong>Need help?</strong><br>';
        html += 'Contact support with Job ID: <code>' + job.id + '</code>';
        html += '</div>';
        
        statusEl.innerHTML = html;
        
        // Re-enable form
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = 'Try Again';
      }
    }
    
    function showError(message) {
      const statusEl = document.getElementById('status');
      statusEl.className = 'status error';
      statusEl.innerHTML = `<strong>❌ Error:</strong> ${escapeHtml(message)}`;
      
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = 'Create WordPress Instance';
    }
    
    async function createInstance(event) {
      event.preventDefault();
      
      const subdomain = document.getElementById('subdomain').value.trim().toLowerCase();
      const wpPassword = document.getElementById('wpPassword').value;
      const submitBtn = document.getElementById('submitBtn');
      const statusEl = document.getElementById('status');
      
      // Stop any existing polling
      stopPolling();
      
      // Disable form
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      
      // Show initial status
      statusEl.className = 'status processing';
      statusEl.innerHTML = '<strong>📤 Submitting...</strong><br>Creating your instance job...';
      
      try {
        const response = await fetch('/api/create-instance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subdomain,
            wpAdminPassword: wpPassword,
            password: formPassword
          })
        });
        
        const data = await response.json();
        
        if (data.success && data.jobId) {
          currentJobId = data.jobId;
          
          // Show initial success
          statusEl.className = 'status queued';
          statusEl.innerHTML = `
            <div class="job-info">Job ID: <strong>${data.jobId}</strong></div>
            <strong>✅ Instance creation started!</strong><br>
            <div style="margin-top: 8px;">
              Your WordPress instance is being created in the background.<br>
              This page will auto-update every 10 seconds with progress.
            </div>
            <div style="margin-top: 12px; font-size: 12px; color: #666;">
              ⏱ Estimated time: 8-12 minutes
            </div>
          `;
          
          // Start polling every 10 seconds
          pollInterval = setInterval(() => {
            pollJobStatus(currentJobId);
          }, 10000);
          
          // Immediate first poll
          setTimeout(() => pollJobStatus(currentJobId), 2000);
          
          // Reset form
          document.getElementById('subdomain').value = '';
          document.getElementById('wpPassword').value = '';
          updateDomainPreview();
          
        } else {
          showError(data.message || 'Failed to start instance creation');
        }
        
      } catch (error) {
        showError(error.message);
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Allow Enter key on password gate
    document.getElementById('gatePassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        unlockForm();
      }
    });
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      stopPolling();
    });
  </script>
</body>
</html>
